<!-- The display screen (/display) runs full screen, without the site header and footer. -->
<app-navbar *ngIf="!isDisplayRoute"></app-navbar>

<main id="main" tabindex="-1" class="app-main" [class.app-main--bare]="isDisplayRoute">
  <router-outlet></router-outlet>
</main>

<footer *ngIf="!isDisplayRoute" class="app-footer">
  <div class="app-container app-footer__inner">
    <div class="app-footer__brand">
      <strong>وقف مركز المصطفى</strong>
      <span>لخدمة القرآن الكريم وعلوم الشريعة</span>
    </div>
    <nav class="app-footer__links" aria-label="روابط التذييل">
      <a routerLink="/books">الكتب</a>
      <a routerLink="/categories">أقسام المكتبة</a>
    </nav>
    <p class="app-footer__copy">© {{ year }} مكتبة مركز المصطفى</p>
  </div>
</footer>

<app-toast-host></app-toast-host>
<app-confirm-host></app-confirm-host>
