<section class="gradient-strip" aria-label="إنشاء حساب">
  <div class="auth-card" role="region" aria-labelledby="registerTitle">
    <div class="header">
      <h2 id="registerTitle">إنشاء حساب جديد</h2>
      <p>ابدأ باستخدام حسابك الآن</p>
    </div>

    <div *ngIf="success" class="alert alert-success">تم التسجيل بنجاح. جاري التحويل...</div>
    <div *ngIf="errMessage" class="alert alert-danger">{{ errMessage }}</div>

    <form [formGroup]="registerForm" (ngSubmit)="register()" novalidate>

      <div class="form-group">
        <input type="text" id="username" class="form-control" formControlName="username" placeholder="اسم المستخدم"
          autocomplete="username"
          [class.is-invalid]="registerForm.get('username')?.invalid && registerForm.get('username')?.touched"
          aria-label="اسم المستخدم">
      </div>

      <div class="form-group">
        <input type="email" id="email" class="form-control" formControlName="email" placeholder="البريد الإلكتروني"
          autocomplete="email"
          [class.is-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
          aria-label="البريد الإلكتروني">
      </div>

      <div class="form-group">
        <input type="password" id="password" class="form-control" formControlName="password" placeholder="كلمة المرور"
          autocomplete="new-password"
          [class.is-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
          aria-label="كلمة المرور">
      </div>

      <div class="form-group">
        <input type="password" id="confirmPassword" class="form-control" formControlName="confirmPassword"
          placeholder="تأكيد كلمة المرور"
          [class.is-invalid]="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched"
          aria-label="تأكيد كلمة المرور">
      </div>

      <div style="position:relative;">
        <button type="submit" class="btn-primary" [disabled]="registerForm.invalid || isLoading"
          style="background: #2ea297;">
          <ng-container *ngIf="!isLoading">إنشاء الحساب</ng-container>
          <ng-container *ngIf="isLoading">جاري الإنشاء...</ng-container>
        </button>

        <div *ngIf="isLoading" class="loading-overlay">
          <div aria-hidden="true">...تحميل</div>
        </div>
      </div>

    </form>

    <hr style="margin:1rem 0; border:none; border-top:1px solid #eef2ff;">

    <p style="text-align:center; font-size:.95rem; color:#6b7280; margin:0;">
      لديك حساب بالفعل؟
      <a routerLink="/login" class="small-link primary">سجّل الدخول</a>
    </p>
  </div>
</section>
