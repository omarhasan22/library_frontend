<div class="app-container page">
  <app-page-header title="أقسام المكتبة" [crumbs]="[{ label: 'الرئيسية', link: '/' }, { label: 'الأقسام' }]">
    <p subtitle *ngIf="state === 'ok'" class="text-ink-600">
      {{ view.length | arCount:'category' }}<ng-container *ngIf="hasCounts && !search"> تضم {{ totalBooks | arCount:'book' }}</ng-container>.
      افتح القسم لترى مواضيعه، أو اختر موضوعاً لعرض كتبه.
    </p>
  </app-page-header>

  <div class="cat-search">
    <label for="cat-q" class="visually-hidden">ابحث في الأقسام والمواضيع</label>
    <i class="fas fa-magnifying-glass cat-search__icon" aria-hidden="true"></i>
    <input id="cat-q" type="search" class="form-control" placeholder="ابحث في الأقسام والمواضيع…" autocomplete="off"
           [(ngModel)]="search" (ngModelChange)="applySearch()" [disabled]="state !== 'ok'">
    <button *ngIf="search" type="button" class="cat-search__clear" (click)="clearSearch()" aria-label="مسح البحث">
      <i class="fas fa-xmark" aria-hidden="true"></i>
    </button>
  </div>

  <app-skeleton *ngIf="state === 'loading'" variant="rows" [count]="8" label="جارٍ تحميل الأقسام…"></app-skeleton>
  <div *ngIf="state === 'error'" class="surface">
    <app-empty-state kind="error" title="تعذّر تحميل الأقسام" (retry)="load()"></app-empty-state>
  </div>

  <div *ngIf="state === 'ok'">
    <p class="visually-hidden" aria-live="polite">{{ search ? (view.length | arCount:'result') : '' }}</p>

    <div *ngIf="!view.length" class="surface">
      <app-empty-state kind="no-results" title="لا توجد أقسام أو مواضيع مطابقة" [message]="'لم نجد «' + search + '». جرّب كلمة أقصر.'">
        <button type="button" class="btn btn-primary" (click)="clearSearch()">مسح البحث</button>
      </app-empty-state>
    </div>

    <ul class="cat-list" *ngIf="view.length">
      <li *ngFor="let c of view; trackBy: trackById" class="cat surface" [class.is-open]="open.has(c._id)">
        <div class="cat__head">
          <button type="button" class="cat__toggle" [attr.aria-expanded]="open.has(c._id)" [attr.aria-controls]="'cat-' + c._id"
                  (click)="toggle(c._id)">
            <i class="fas fa-chevron-down cat__chev" aria-hidden="true"></i>
            <span class="cat__title">
              <ng-container *ngFor="let p of parts(c.title)"><mark *ngIf="p.hit">{{ p.text }}</mark><ng-container *ngIf="!p.hit">{{ p.text }}</ng-container></ng-container>
            </span>
            <span class="cat__meta">
              <ng-container *ngIf="c.booksCount !== undefined">{{ c.booksCount | arCount:'book' }} · </ng-container>{{ c.subjects.length | arCount:'subject' }}
            </span>
          </button>
          <a class="btn btn-sm btn-outline-primary cat__all" routerLink="/books" [queryParams]="{ category: c._id }"
             [attr.aria-label]="'عرض كتب ' + c.title">
            عرض الكتب
          </a>
        </div>

        <div [id]="'cat-' + c._id" class="cat__body" [hidden]="!open.has(c._id)">
          <p *ngIf="!c.shownSubjects.length" class="cat__empty">لا مواضيع مسجّلة في هذا القسم.</p>
          <ul *ngIf="c.shownSubjects.length" class="subjects">
            <li *ngFor="let s of c.shownSubjects; trackBy: trackById">
              <a class="subject" routerLink="/books" [queryParams]="{ category: c._id, subject: s._id }"
                 [class.is-empty]="s.booksCount === 0">
                <span class="subject__title">
                  <ng-container *ngFor="let p of parts(s.title)"><mark *ngIf="p.hit">{{ p.text }}</mark><ng-container *ngIf="!p.hit">{{ p.text }}</ng-container></ng-container>
                </span>
                <span *ngIf="s.booksCount !== undefined" class="subject__count">{{ s.booksCount | num }}</span>
              </a>
            </li>
          </ul>
        </div>
      </li>
    </ul>
  </div>
</div>
