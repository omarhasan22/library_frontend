<div class="wrapper">
  <div class="main-panel">
    <div class="main-header">
      <!-- Navbar Header -->
      <nav class="navbar navbar-expand-lg navbar-header navbar-header-transparent border-bottom">
        <div class="container-fluid justify-content-center">
          <form class="d-flex align-items-center" style="max-width: 600px; width: 100%;">
            <div class="input-group w-100">
              <nav class="navbar navbar-header navbar-header-transparent navbar-expand-lg border-bottom"
                style="width: 100%;">
                <div class="container-fluid">
                  <div>
                    <select class="form-select" [(ngModel)]="searchOption" name="searchSelect">
                      <option selected [ngValue]="'all'">الكل</option>
                      <option *ngFor="let c of categories" [ngValue]="c.key">{{ c.value }}</option>
                    </select>
                  </div>
                  <nav class="navbar navbar-header-left navbar-expand-lg navbar-form nav-search p-0  d-lg-flex">
                    <div class="input-group">
                      <input type="text" class="form-control" name="search"
                        placeholder="ابحث بعنوان، مؤلف، ناشر، تصنيف..." [(ngModel)]="searchQuery" />
                      <div class="input-group-prepend">
                        <button (click)="loadBooks()" class="btn btn-search pe-1">
                          <i class="fa fa-search search-icon"></i>
                        </button>
                      </div>
                    </div>
                  </nav>
                </div>
              </nav>
            </div>
          </form>
        </div>
      </nav>
      <!-- End Navbar -->
    </div>

    <div class="container">
      <div class="page-inner">
        <div class="row">
          <div class="col-md-12">
            <div class="card">
              <div class="card-header">
                <div class="mb-3">
                  <div class="d-flex gap-3 justify-content-center flex-wrap">
                    <span class="badge bg-primary">عدد الكتب: {{ totalBooks }}</span>
                    <span class="badge bg-success">عدد المؤلفين: {{ uniqueAuthors }}</span>
                    <span class="badge bg-warning text-dark">عدد الناشرين: {{ uniquePublishers }}</span>
                  </div>
                </div>
              </div>
              <div class="card-body">
                <div class="table-responsive">

                  <table id="basic-datatables" class="display table table-striped table-hover">
                    <thead>
                      <tr>
                        <th *ngFor="let col of categories">{{col.value}}</th>

                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let book of books" (click)="viewBook(book._id)" style="cursor: pointer;">
                        <td *ngFor="let col of categories">
                          {{ renderValue(book, col.key) }}
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
