<div class="wrapper">
  <div class="main-panel">
    <div class="main-header">
      <!-- Navbar Header -->
      <nav class="navbar navbar-expand-lg navbar-header navbar-header-transparent border-bottom">
        <div class="container-fluid justify-content-center">
          <form class="d-flex align-items-center" style="max-width: 600px; width: 100%;">
            <div class="input-group w-100">
              <nav class="navbar navbar-header navbar-header-transparent navbar-expand-lg border-bottom"
                style="width: 100%;">
                <div class="container-fluid">
                  <div class="mb-3">
                    <div *ngFor="let filter of searchFilters; let i = index"
                      class="d-flex gap-2 align-items-center mb-2">
                      <select class="form-select" [(ngModel)]="filter.field" name="searchField{{i}}"
                        style="min-width: 150px;">
                        <option [ngValue]="'all'">الكل</option>
                        <option *ngFor="let c of categories" [ngValue]="c.key">{{ c.value }}</option>
                      </select>
                      <input class="form-control" [(ngModel)]="filter.value" name="searchValue{{i}}"
                        placeholder="القيمة..." />
                      <button class="btn btn-danger btn-sm" (click)="removeFilter(i)"
                        *ngIf="searchFilters.length > 1">×</button>
                    </div>
                    <div class="d-flex gap-2">
                      <button class="btn btn-sm btn-success" (click)="addFilter()">إضافة شرط</button>
                      <button class="btn btn-primary" (click)="loadBooks()">بحث</button>
                      <button class="btn btn-secondary" (click)="resetSearch()">إعادة ضبط</button>
                    </div>
                  </div>
                </div>
              </nav>
            </div>
          </form>
        </div>
      </nav>
      <!-- End Navbar -->
    </div>

    <div class="container-fluid">
      <div class="page-inner">
        <div class="row">
          <div class="col-12"> <!-- use col-12 to allow full width -->
            <div class="card">

              <div class="card-header">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                  <!-- Scroll Buttons -->
                  <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-primary" (click)="scrollToTop()">🔼 أعلى</button>
                    <button class="btn btn-sm btn-outline-secondary" (click)="scrollToBottom()">🔽 آخر كتاب</button>
                  </div>

                  <!-- Book Stats -->
                  <div class="d-flex gap-3 flex-wrap justify-content-center">
                    <span class="badge bg-primary">عدد الكتب: {{ totalBooks }}</span>
                    <span class="badge bg-success">عدد المؤلفين: {{ uniqueAuthors }}</span>
                    <span class="badge bg-warning text-dark">عدد الناشرين: {{ uniquePublishers }}</span>
                  </div>
                </div>
              </div>

              <div class="card-body">
                <div class="table-responsive">

                  <table id="book-table" class="display table table-striped table-hover">
                    <thead>
                      <tr>
                        <th *ngFor="let col of categories">{{col.value}}</th>

                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let book of books" (click)="viewBook(book._id)" [id]="'book-' + book._id"
                        style="cursor: pointer;" [id]="'book-' + book._id">
                        <td *ngFor="let col of categories">
                          {{ renderValue(book, col.key) }}
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
