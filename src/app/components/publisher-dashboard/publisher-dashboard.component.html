<div class="app-container page">
  <app-page-header title="الناشرون" [crumbs]="[{ label: 'الإدارة' }, { label: 'الناشرون' }]">
    <p subtitle class="text-ink-600">
      <ng-container *ngIf="stats">{{ stats.totalPublishers | arCount:'publisher' }} في الفهرس.</ng-container>&nbsp;
    </p>
    <button actions type="button" class="btn btn-primary" (click)="openAdd()">
      <i class="fas fa-plus" aria-hidden="true"></i> إضافة ناشر
    </button>
  </app-page-header>

  <div class="toolbar surface">
    <div class="toolbar__search">
      <label for="pub-q" class="visually-hidden">ابحث في الناشرين</label>
      <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
      <input id="pub-q" type="search" class="form-control" placeholder="ابحث باسم الناشر أو المدينة…" autocomplete="off"
             [(ngModel)]="search" (ngModelChange)="onSearch($event)">
    </div>
    <label for="pub-size" class="small text-ink-600">في الصفحة</label>
    <select id="pub-size" class="form-select form-select-sm" [ngModel]="pageSize" (ngModelChange)="setPageSize($event)">
      <option [ngValue]="20">20</option>
      <option [ngValue]="50">50</option>
      <option [ngValue]="100">100</option>
    </select>
  </div>

  <app-skeleton *ngIf="state === 'loading'" variant="rows" [count]="8" label="جارٍ تحميل الناشرين…"></app-skeleton>
  <div *ngIf="state === 'error'" class="surface"><app-empty-state kind="error" title="تعذّر تحميل الناشرين" (retry)="load()"></app-empty-state></div>

  <ng-container *ngIf="state === 'ok'">
    <div *ngIf="!publishers.length" class="surface">
      <app-empty-state [kind]="search ? 'no-results' : 'empty'" [title]="search ? 'لا يوجد ناشر بهذا الاسم' : 'لا يوجد ناشرون بعد'">
        <button type="button" class="btn btn-primary" (click)="openAdd()">إضافة ناشر</button>
      </app-empty-state>
    </div>

    <div *ngIf="publishers.length" class="list-wrap surface" [class.is-refreshing]="refreshing" [attr.aria-busy]="refreshing">
      <table class="table admin-table">
        <caption class="visually-hidden">قائمة الناشرين، الصفحة {{ page }} من {{ totalPages }}</caption>
        <thead>
          <tr>
            <th scope="col">الناشر</th>
            <th scope="col" class="col-actions"><span class="visually-hidden">إجراءات</span></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of publishers; trackBy: trackById">
            <td class="cell-name">{{ p.title }}</td>
            <td class="col-actions">
              <div class="row-actions">
                <a class="btn btn-sm btn-link" routerLink="/books" [queryParams]="{ f: 'publishers:' + p.title }">كتبه</a>
                <button type="button" class="btn btn-sm btn-icon btn-secondary" (click)="openEdit(p)"
                        [attr.aria-label]="'تعديل ' + p.title" title="تعديل"><i class="fas fa-pen" aria-hidden="true"></i></button>
                <button type="button" class="btn btn-sm btn-icon btn-outline-danger" (click)="remove(p)"
                        [attr.aria-label]="'حذف ' + p.title" title="حذف"><i class="fas fa-trash-can" aria-hidden="true"></i></button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-pagination [currentPage]="page" [totalPages]="totalPages" [totalItems]="total" [pageSize]="pageSize"
                    label="صفحات الناشرين" (pageChange)="onPage($event)"></app-pagination>
  </ng-container>
</div>

<dialog #formDialog class="form-dialog" aria-labelledby="publisher-form-title">
  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="form-dialog__head">
      <h2 id="publisher-form-title" class="form-dialog__title">{{ editing ? 'تعديل الناشر' : 'إضافة ناشر' }}</h2>
      <button type="button" class="btn-close" (click)="closeForm()" aria-label="إغلاق"></button>
    </div>
    <div class="form-dialog__body">
      <div>
        <label for="publisher-title" class="form-label">اسم الناشر<span class="req" aria-hidden="true"> *</span></label>
        <input id="publisher-title" class="form-control" formControlName="title" autocomplete="off"
               placeholder="مثل: دار القلم - دمشق"
               [class.is-invalid]="titleError" [attr.aria-invalid]="titleError ? true : null" aria-describedby="publisher-title-err">
        <p *ngIf="titleError" id="publisher-title-err" class="field-error">{{ titleError }}</p>
      </div>
    </div>
    <div class="form-dialog__actions">
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        <span *ngIf="saving" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        {{ editing ? 'حفظ التغييرات' : 'إضافة' }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="closeForm()">إلغاء</button>
    </div>
  </form>
</dialog>
