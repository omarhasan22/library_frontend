<div class="publisher-dashboard-container">
   <div class="container">
      <div class="row">
         <div class="col-12">
            <div class="dashboard-header">
               <h2><i class="fas fa-building me-2"></i>إدارة الناشرين</h2>
               <button class="btn btn-primary" (click)="openAddForm()">
                  <i class="fas fa-plus me-1"></i>إضافة ناشر
               </button>
            </div>

            <!-- Message Display -->
            <div *ngIf="message" class="alert" [class]="messageType === 'success' ? 'alert-success' : 'alert-danger'"
               role="alert">
               <i class="fas" [class]="messageType === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'"></i>
               {{ message }}
            </div>

            <!-- Statistics Cards -->
            <div class="row mb-4" *ngIf="stats">
               <div class="col-md-4">
                  <div class="stat-card">
                     <div class="stat-icon">
                        <i class="fas fa-building"></i>
                     </div>
                     <div class="stat-content">
                        <h3>{{ stats.totalPublishers }}</h3>
                        <p>إجمالي الناشرين</p>
                     </div>
                  </div>
               </div>
            </div>

            <!-- Search and Filters -->
            <div class="row mb-4">
               <div class="col-md-6">
                  <div class="search-box">
                     <i class="fas fa-search"></i>
                     <input type="text" [(ngModel)]="searchTerm" (keyup.enter)="onSearch()"
                        placeholder="البحث في الناشرين...">
                     <button class="btn btn-outline-primary" (click)="onSearch()">بحث</button>
                  </div>
               </div>
               <div class="col-md-3">
                  <select class="form-select" [(ngModel)]="limit" (change)="loadPublishers()">
                     <option value="10">10 لكل صفحة</option>
                     <option value="25">25 لكل صفحة</option>
                     <option value="50">50 لكل صفحة</option>
                  </select>
               </div>
            </div>

            <!-- Publishers Table -->
            <div class="table-container">
               <table class="table table-hover">
                  <thead>
                     <tr>
                        <th>اسم الناشر</th>
                        <th>الإجراءات</th>
                     </tr>
                  </thead>
                  <tbody>
                     <tr *ngFor="let publisher of publishers">
                        <td>
                           <div class="publisher-name">
                              <i class="fas fa-building me-2"></i>
                              {{ publisher.title }}
                           </div>
                        </td>
                        <td>
                           <div class="action-buttons">
                              <button class="btn btn-sm btn-outline-primary" (click)="openEditForm(publisher)">
                                 <i class="fas fa-edit"></i>
                              </button>
                              <button class="btn btn-sm btn-outline-danger" (click)="deletePublisher(publisher)">
                                 <i class="fas fa-trash"></i>
                              </button>
                           </div>
                        </td>
                     </tr>
                  </tbody>
               </table>

               <!-- Loading -->
               <div *ngIf="loading" class="text-center py-4">
                  <div class="spinner-border text-primary" role="status">
                     <span class="visually-hidden">جاري التحميل...</span>
                  </div>
               </div>

               <!-- Empty State -->
               <div *ngIf="!loading && publishers.length === 0" class="empty-state">
                  <i class="fas fa-building"></i>
                  <h4>لا توجد ناشرين</h4>
                  <p>لم يتم العثور على أي ناشرين</p>
               </div>
            </div>

            <!-- Pagination -->
            <div class="pagination-container" *ngIf="totalPages > 1">
               <nav>
                  <ul class="pagination">
                     <li class="page-item" [class.disabled]="currentPage === 1">
                        <button class="page-link" (click)="onPageChange(currentPage - 1)"
                           [disabled]="currentPage === 1">
                           السابق
                        </button>
                     </li>
                     <li *ngFor="let page of getPaginationPages()" class="page-item"
                        [class.active]="page === currentPage">
                        <button class="page-link" (click)="onPageChange(page)">{{ page }}</button>
                     </li>
                     <li class="page-item" [class.disabled]="currentPage === totalPages">
                        <button class="page-link" (click)="onPageChange(currentPage + 1)"
                           [disabled]="currentPage === totalPages">
                           التالي
                        </button>
                     </li>
                  </ul>
               </nav>
            </div>
         </div>
      </div>
   </div>

   <!-- Publisher Form Modal -->
   <div class="modal" [class.show]="isEditing || publisherForm.get('title')?.value"
      [style.display]="(isEditing || publisherForm.get('title')?.value) ? 'block' : 'none'">
      <div class="modal-dialog">
         <div class="modal-content">
            <div class="modal-header">
               <h5 class="modal-title">
                  {{ isEditing ? 'تعديل الناشر' : 'إضافة ناشر جديد' }}
               </h5>
               <button type="button" class="btn-close" (click)="closeForm()"></button>
            </div>
            <div class="modal-body">
               <form [formGroup]="publisherForm" (ngSubmit)="onSubmit()">
                  <div class="mb-3">
                     <label for="title" class="form-label">اسم الناشر *</label>
                     <input type="text" class="form-control" id="title" formControlName="title"
                        [class.is-invalid]="publisherForm.get('title')?.invalid && publisherForm.get('title')?.touched">
                     <div class="invalid-feedback"
                        *ngIf="publisherForm.get('title')?.invalid && publisherForm.get('title')?.touched">
                        اسم الناشر مطلوب ويجب أن يكون حرفين على الأقل
                     </div>
                  </div>
               </form>
            </div>
            <div class="modal-footer">
               <button type="button" class="btn btn-secondary" (click)="closeForm()">إلغاء</button>
               <button type="button" class="btn btn-primary" (click)="onSubmit()"
                  [disabled]="publisherForm.invalid || loading">
                  <span class="spinner-border spinner-border-sm me-1" *ngIf="loading"></span>
                  {{ isEditing ? 'تحديث' : 'إضافة' }}
               </button>
            </div>
         </div>
      </div>
   </div>
</div>
