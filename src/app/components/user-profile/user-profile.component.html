<div class="app-container page profile-page">
  <app-page-header title="الملف الشخصي" [crumbs]="[{ label: 'الرئيسية', link: '/' }, { label: 'الملف الشخصي' }]"></app-page-header>

  <app-skeleton *ngIf="loadingUser" variant="lines" [count]="4" label="جارٍ تحميل الحساب…"></app-skeleton>

  <ng-container *ngIf="!loadingUser">
    <section class="who surface" aria-label="الحساب">
      <span class="who__avatar" aria-hidden="true">{{ initial }}</span>
      <div>
        <p class="who__name">{{ currentUser?.username }}</p>
        <p class="who__meta">
          <span class="role-tag" [class.is-admin]="currentUser?.role === 'admin'">{{ currentUser?.role === 'admin' ? 'مشرف' : 'مستخدم' }}</span>
          <span *ngIf="joined"> · عضو منذ {{ joined }}</span>
        </p>
      </div>
    </section>

    <div class="profile-grid">
      <!-- Account -->
      <form class="form-card surface" [formGroup]="profileForm" (ngSubmit)="saveProfile()" novalidate aria-labelledby="acc-title">
        <h2 id="acc-title" class="form-card__title">بيانات الحساب</h2>
        <div *ngIf="profileError" class="alert alert-danger py-2" role="alert">{{ profileError }}</div>
        <div class="field">
          <label for="p-username" class="form-label">اسم المستخدم</label>
          <input id="p-username" class="form-control" formControlName="username" autocomplete="username" dir="auto"
                 [class.is-invalid]="error('profile', 'username')" [attr.aria-invalid]="error('profile', 'username') ? true : null"
                 aria-describedby="p-username-err">
          <p *ngIf="error('profile', 'username')" id="p-username-err" class="field-error">{{ error('profile', 'username') }}</p>
        </div>
        <div class="field">
          <label for="p-email" class="form-label">البريد الإلكتروني</label>
          <input id="p-email" type="email" class="form-control" formControlName="email" autocomplete="email" dir="ltr"
                 [class.is-invalid]="error('profile', 'email')" [attr.aria-invalid]="error('profile', 'email') ? true : null"
                 aria-describedby="p-email-err">
          <p *ngIf="error('profile', 'email')" id="p-email-err" class="field-error">{{ error('profile', 'email') }}</p>
        </div>
        <div class="form-card__actions">
          <button type="submit" class="btn btn-primary" [disabled]="savingProfile || !profileChanged">
            <span *ngIf="savingProfile" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
            حفظ البيانات
          </button>
          <button *ngIf="profileChanged" type="button" class="btn btn-link" (click)="resetProfile()">تراجع عن التعديل</button>
        </div>
      </form>

      <!-- Password -->
      <form class="form-card surface" [formGroup]="passwordForm" (ngSubmit)="savePassword()" novalidate aria-labelledby="pw-title">
        <h2 id="pw-title" class="form-card__title">تغيير كلمة المرور</h2>
        <div *ngIf="passwordError" class="alert alert-danger py-2" role="alert">{{ passwordError }}</div>
        <div class="field" *ngFor="let f of [
            { name: 'currentPassword', label: 'كلمة المرور الحالية', auto: 'current-password' },
            { name: 'newPassword', label: 'كلمة المرور الجديدة', auto: 'new-password' },
            { name: 'confirmPassword', label: 'تأكيد كلمة المرور الجديدة', auto: 'new-password' }]">
          <label [for]="'p-' + f.name" class="form-label">{{ f.label }}</label>
          <input [id]="'p-' + f.name" class="form-control" [formControlName]="f.name" [autocomplete]="f.auto" dir="ltr"
                 [type]="showPasswords ? 'text' : 'password'"
                 [class.is-invalid]="error('password', f.name)" [attr.aria-invalid]="error('password', f.name) ? true : null"
                 [attr.aria-describedby]="'p-' + f.name + '-err'">
          <p *ngIf="error('password', f.name)" [id]="'p-' + f.name + '-err'" class="field-error">{{ error('password', f.name) }}</p>
        </div>
        <div class="form-check">
          <input id="p-show" class="form-check-input" type="checkbox" [checked]="showPasswords" (change)="showPasswords = !showPasswords">
          <label for="p-show" class="form-check-label">إظهار كلمات المرور</label>
        </div>
        <div class="form-card__actions">
          <button type="submit" class="btn btn-primary" [disabled]="savingPassword">
            <span *ngIf="savingPassword" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
            تغيير كلمة المرور
          </button>
        </div>
      </form>
    </div>
  </ng-container>
</div>
