<div class="auth">
  <div class="auth-card">
    <img class="auth-card__logo" src="assets/img/logos/logo-360.png" alt="" width="160" height="52">
    <h1 class="auth-card__title">تسجيل الدخول</h1>
    <p class="auth-card__sub">لإدارة الفهرس وإضافة الكتب. التصفّح والبحث متاحان للجميع دون حساب.</p>

    <div *ngIf="message" class="auth-alert auth-alert--error" role="alert">
      <i class="fas fa-circle-exclamation" aria-hidden="true"></i><span>{{ message }}</span>
    </div>

    <form *ngIf="loginForm" class="auth-form" [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
      <div>
        <label for="login-user" class="form-label">اسم المستخدم أو البريد الإلكتروني</label>
        <input id="login-user" class="form-control" formControlName="emailOrUsername" autocomplete="username"
               dir="auto" [class.is-invalid]="error('emailOrUsername')"
               [attr.aria-invalid]="error('emailOrUsername') ? true : null" aria-describedby="login-user-err">
        <p *ngIf="error('emailOrUsername')" id="login-user-err" class="field-error">{{ error('emailOrUsername') }}</p>
      </div>

      <div>
        <label for="login-password" class="form-label">كلمة المرور</label>
        <div class="password">
          <input id="login-password" class="form-control" formControlName="password" autocomplete="current-password"
                 [type]="showPassword ? 'text' : 'password'" dir="ltr" [class.is-invalid]="error('password')"
                 [attr.aria-invalid]="error('password') ? true : null" aria-describedby="login-password-err">
          <button type="button" class="password__toggle" (click)="showPassword = !showPassword"
                  [attr.aria-pressed]="showPassword" [attr.aria-label]="showPassword ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'">
            <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword" aria-hidden="true"></i>
          </button>
        </div>
        <p *ngIf="error('password')" id="login-password-err" class="field-error">{{ error('password') }}</p>
      </div>

      <button type="submit" class="btn btn-primary auth-submit" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        {{ isLoading ? 'جارٍ الدخول…' : 'دخول' }}
      </button>
    </form>

    <p class="auth-switch">ليس لديك حساب؟ <a routerLink="/register">إنشاء حساب</a></p>
  </div>
</div>
