<section class="gradient-strip" aria-label="تسجيل الدخول">
  <div class="auth-card" role="region" aria-labelledby="loginTitle">
    <div class="header">
      <h2 id="loginTitle">مرحباً بعودتك</h2>
      <p>سجّل الدخول لمتابعة حسابك</p>
    </div>

    <!-- تنبيهات -->
    <div *ngIf="message && !isSuccess" class="alert alert-danger" role="alert">{{ message }}</div>
    <div *ngIf="message && isSuccess" class="alert alert-success" role="alert">{{ message }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="login()" novalidate>

      <div class="form-group">
        <input type="text" id="emailOrUsername" class="form-control" formControlName="emailOrUsername"
          placeholder="البريد الإلكتروني أو اسم المستخدم" autocomplete="username"
          [class.is-invalid]="loginForm.get('emailOrUsername')?.invalid && loginForm.get('emailOrUsername')?.touched"
          aria-label="البريد الإلكتروني أو اسم المستخدم">
      </div>

      <div class="form-group">
        <input type="password" id="password" class="form-control" formControlName="password" placeholder="كلمة المرور"
          autocomplete="current-password"
          [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          aria-label="كلمة المرور">
      </div>

      <div class="d-flex justify-content-between align-items-center" style="margin-bottom:.9rem;">
        <!-- <label class="form-check" style="margin:0;">
          <input type="checkbox" class="form-check-input" formControlName="rememberMe" id="rememberMe">
          <span style="font-size:.95rem;">تذكرني</span>
        </label> -->

        <!-- <a href="#" class="small-link primary">هل نسيت كلمة المرور؟</a> -->
      </div>

      <div style="position:relative;">
        <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || isLoading"
          style="background: #2ea297;">
          <ng-container *ngIf="!isLoading">تسجيل الدخول</ng-container>
          <ng-container *ngIf="isLoading">جاري الدخول...</ng-container>
        </button>

        <div *ngIf="isLoading" class="loading-overlay" style="background: #2ea297;">
          <div aria-hidden="true" style="color: white;">...تحميل</div>
        </div>
      </div>

    </form>

    <hr style="margin:1rem 0; border:none; border-top:1px solid #eef2ff;">

    <p style="text-align:center; font-size:.95rem; color:#6b7280; margin:0;">
      ليس لديك حساب؟
      <a routerLink="/register" class="small-link primary">أنشئ حسابًا</a>
    </p>
  </div>
</section>
